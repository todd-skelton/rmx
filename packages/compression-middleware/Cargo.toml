[package]
name = "rsmix-compression-middleware"
description = "Middleware for compressing HTTP responses (remix compression-middleware)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
http.workspace = true
rsmix-fetch.workspace = true
rsmix-response = { workspace = true, features = ["compress"] }
rsmix-mime.workspace = true
rsmix-fetch-router.workspace = true

[dev-dependencies]
brotli = { version = "9", default-features = false, features = ["std"] }
flate2 = "1"
