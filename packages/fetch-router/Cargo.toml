[package]
name = "rsmix-fetch-router"
description = "A composable router on Request/Response with route maps, middleware and typed request context (port of remix fetch-router)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
http.workspace = true
rsmix-fetch.workspace = true
rsmix-response.workspace = true
rsmix-macros.workspace = true
rsmix-route-pattern.workspace = true
rsmix-url.workspace = true

# Bold table headers in `routes_command` on a color terminal.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rsmix-terminal.workspace = true

# Doctests and tests use `#[derive(RouteMap)]`, which expands to `::rsmix::router` paths.
[dev-dependencies]
rsmix = { path = "../rsmix", default-features = false }
