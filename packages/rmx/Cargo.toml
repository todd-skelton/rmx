[package]
name = "rmx"
description = "Remix 3 for Rust in one dependency: components and rsx! at the root, plus the router, middleware, auth, sessions and the rest of the toolkit as modules"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["ui", "frames", "navigation", "spa"]
# The rmx-ui component library (accordion, menu, popover, ...).
ui = ["dep:rmx-ui"]
# Browser runtime parts a client build can leave out (wasm32 only; the server always renders
# <Frame>). `frames`: <Frame> loading, reloads and streamed content in the browser.
# `navigation`: links and forms as soft navigations. A client that only hydrates client
# entries can use `default-features = false`; see rmx-component's Cargo.toml for what changes.
frames = ["rmx-component/frames"]
navigation = ["rmx-component/navigation", "frames"]
# Client-side routing (`rmx::spa`): runs the router in the browser through frames.
spa = ["dep:rmx-spa", "navigation"]

[dependencies]
rmx-component.workspace = true
rmx-data-schema.workspace = true
rmx-fetch.workspace = true
rmx-response.workspace = true
rmx-headers.workspace = true
rmx-lazy-file.workspace = true
rmx-mime.workspace = true
rmx-route-pattern.workspace = true
rmx-fetch-router.workspace = true
rmx-spa = { workspace = true, optional = true }
rmx-ui = { workspace = true, optional = true }
rmx-url.workspace = true

# The server side is native only. Browser builds get the component runtime and the crates
# above (route maps and hrefs are shared between server and client, and `spa` runs the router in
# the browser).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rmx-assets.workspace = true
rmx-auth.workspace = true
rmx-cli.workspace = true
rmx-cookie.workspace = true
rmx-crypto.workspace = true
rmx-fetch-proxy.workspace = true
rmx-file-storage.workspace = true
rmx-fs.workspace = true
rmx-html-template.workspace = true
rmx-auth-middleware.workspace = true
rmx-compression-middleware.workspace = true
rmx-cop-middleware.workspace = true
rmx-cors-middleware.workspace = true
rmx-csrf-middleware.workspace = true
rmx-form-data-middleware.workspace = true
rmx-live-reload-middleware.workspace = true
rmx-logger-middleware.workspace = true
rmx-method-override-middleware.workspace = true
rmx-session-middleware.workspace = true
rmx-static-middleware.workspace = true
rmx-multipart-parser.workspace = true
rmx-render-middleware.workspace = true
rmx-node-fetch-server.workspace = true
rmx-session.workspace = true
rmx-tar-parser.workspace = true
rmx-terminal.workspace = true

[dev-dependencies]
http.workspace = true
