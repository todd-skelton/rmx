[package]
name = "rmx-render-middleware"
description = "Server rendering for rmx-fetch-router handlers: ctx.render(node) with streamed <Frame> resolution"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
http.workspace = true
# Imported as `rmx` so `rsx!` output (`::rmx::...`) resolves without the umbrella crate.
rmx = { package = "rmx-component", path = "../component" }
rmx-fetch.workspace = true
rmx-response.workspace = true
rmx-fetch-router.workspace = true
rmx-url.workspace = true

[dev-dependencies]
rmx-fetch.workspace = true
