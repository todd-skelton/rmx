[package]
name = "rsmix-cli"
description = "Command-line interface for rsmix (remix cli): new, dev, doctor, completion, routes, assets, test"
edition.workspace = true
version.workspace = true
license.workspace = true

# `cargo install --path packages/cli` installs the `rsmix` command.
[[bin]]
name = "rsmix"
path = "src/main.rs"
doc = false

[dependencies]
rsmix-terminal.workspace = true
