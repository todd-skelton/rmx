[package]
name = "rsmix-node-fetch-server"
description = "Serve an rsmix Router over HTTP/1 and HTTP/2 with hyper and tokio"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
http.workspace = true
http-body.workspace = true
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
rsmix-fetch.workspace = true
rsmix-response.workspace = true
rsmix-fetch-router.workspace = true
rsmix-url.workspace = true
tokio.workspace = true

[dev-dependencies]
rsmix-fetch-proxy.workspace = true
