[package]
name = "rsmix-session"
description = "Sessions for rsmix: a Session with values and flash data, and cookie, memory and filesystem storages (Remix's session package)"
edition.workspace = true
version = "1.0.0"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
rsmix-crypto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }

[features]
default = ["fs"]
