[package]
name = "rsmix-spa"
description = "Run an rsmix-fetch-router in the browser: client-only apps with the server's Request/Response contract (port of remix/spa)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
http.workspace = true
# Imported as `rsmix` so `rsx!` output (`::rsmix::...`) resolves without the umbrella crate.
# The browser router loads frames through `resolve_frame` and needs soft navigation.
rsmix = { package = "rsmix-component", path = "../component", default-features = false, features = ["navigation"] }
rsmix-fetch.workspace = true
rsmix-response.workspace = true
rsmix-fetch-router.workspace = true
rsmix-url.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Document", "Event", "EventTarget", "Window"] }

[dev-dependencies]
tokio = { workspace = true }
