[package]
name = "rmx-component"
description = "A Remix 3 style component model for Rust: setup once, render on update(), server HTML, client entries"
edition.workspace = true
version.workspace = true
license.workspace = true

# Browser runtime parts an app can compile out (they only affect wasm32 builds; server
# rendering of <Frame> is always available). With both off, the client hydrates client
# entries and renders components, and that is all.
[features]
default = ["frames", "navigation"]
# <Frame> in the browser: reloads, streamed templates, server HTML reconciliation, and
# FrameHandle::reload/replace. Off: the top frame is the document (reload loads the page),
# and a client-rendered <Frame> renders its fallback.
frames = []
# Soft navigation: links and forms reload frames through the Navigation API. Off: links and
# forms are plain browser navigations, and navigate() assigns location.
navigation = ["frames"]

[dependencies]
rmx-macros.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }

# Server rendering only (the browser build keeps core's code, so the client does not grow):
# memchr for escaping long text, and zmij (already in the tree through serde_json) for float
# digits.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memchr.workspace = true
zmij = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "AbortController",
    "AddEventListenerOptions",
    "AbortSignal",
    "CharacterData",
    "Comment",
    "console",
    "CssRuleList",
    "CssStyleSheet",
    "Document",
    "DocumentFragment",
    "DomParser",
    "DomStringMap",
    "Element",
    "ErrorEvent",
    "Event",
    "EventTarget",
    "FormData",
    "Headers",
    "HtmlElement",
    "HtmlFormElement",
    "HtmlHeadElement",
    "HtmlTemplateElement",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "Location",
    "MutationObserver",
    "MutationObserverInit",
    "MutationRecord",
    "Node",
    "NodeList",
    "Performance",
    "RequestInit",
    "ReadableStream",
    "RequestMode",
    "ScrollBehavior",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "Response",
    "SupportedType",
    "Text",
    "TextDecoder",
    "TreeWalker",
    "Url",
    "UrlSearchParams",
    "Window",
] }

[dev-dependencies]
serde.workspace = true

# Browser tests (`tests/browser_*.rs`): run with ../../scripts/test-browser.ps1.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
web-sys = { workspace = true, features = ["ErrorEvent", "ErrorEventInit", "HtmlDivElement", "CssRule", "CssRuleList", "CssStyleSheet", "CssStyleDeclaration", "Window", "History", "HtmlElement", "HtmlButtonElement", "HtmlFormElement", "HtmlHeadElement", "HtmlInputElement", "Request", "HtmlTextAreaElement", "EventInit", "HtmlSelectElement", "MouseEvent", "MouseEventInit"] }
