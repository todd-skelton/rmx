[workspace]
resolver = "2"
# The phase 0 Leptos spike is its own project with its own lockfile.
exclude = ["bench/leptos-spike"]
members = [
    "packages/url",
    "packages/route-pattern",
    "packages/fetch",
    "packages/response",
    "packages/fetch-router",
    "packages/node-fetch-server",
    "packages/mime",
    "packages/auth-middleware",
    "packages/compression-middleware",
    "packages/cop-middleware",
    "packages/cors-middleware",
    "packages/csrf-middleware",
    "packages/form-data-middleware",
    "packages/live-reload-middleware",
    "packages/logger-middleware",
    "packages/method-override-middleware",
    "packages/session-middleware",
    "packages/static-middleware",
    "packages/render-middleware",
    "packages/cookie",
    "packages/spa",
    "packages/assets",
    "packages/crypto",
    "packages/session",
    "packages/file-storage",
    "packages/tar-parser",
    "packages/multipart-parser",
    "packages/html-template",
    "packages/headers",
    "packages/fetch-proxy",
    "packages/auth",
    "packages/cli",
    "packages/component",
    "packages/rsmix",
    "packages/component/macros",
    "packages/ui",
    "packages/data-schema",
    "packages/terminal",
    "packages/lazy-file",
    "packages/fs",
    "bench/rsmix-app/app",
    "bench/rsmix-app/server",
    "bench/rsmix-app/client",
    "demos/frames",
    "demos/frame-navigation",
    "demos/lazy-frames",
    "demos/sse",
    "demos/spa",
    "demos/assets",
    "demos/ui",
    "demos/social-auth",
    "demos/i18n",
    "demos/bookstore",
    "demos/unpkg",
    "demos/timeboxer",
    "template",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
rsmix = { path = "packages/rsmix" }
# Only the rsmix umbrella crate uses this; its features turn the browser runtime parts on.
rsmix-component = { path = "packages/component", default-features = false }
rsmix-macros = { path = "packages/component/macros" }
rsmix-url = { path = "packages/url" }
rsmix-terminal = { path = "packages/terminal" }
rsmix-route-pattern = { path = "packages/route-pattern" }
rsmix-fetch = { path = "packages/fetch" }
rsmix-response = { path = "packages/response" }
rsmix-fetch-router = { path = "packages/fetch-router" }
rsmix-node-fetch-server = { path = "packages/node-fetch-server" }
rsmix-mime = { path = "packages/mime" }
rsmix-auth-middleware = { path = "packages/auth-middleware" }
rsmix-compression-middleware = { path = "packages/compression-middleware" }
rsmix-cop-middleware = { path = "packages/cop-middleware" }
rsmix-cors-middleware = { path = "packages/cors-middleware" }
rsmix-csrf-middleware = { path = "packages/csrf-middleware" }
rsmix-form-data-middleware = { path = "packages/form-data-middleware" }
rsmix-live-reload-middleware = { path = "packages/live-reload-middleware" }
rsmix-logger-middleware = { path = "packages/logger-middleware" }
rsmix-method-override-middleware = { path = "packages/method-override-middleware" }
rsmix-session-middleware = { path = "packages/session-middleware" }
rsmix-static-middleware = { path = "packages/static-middleware" }
rsmix-render-middleware = { path = "packages/render-middleware" }
rsmix-spa = { path = "packages/spa" }
rsmix-assets = { path = "packages/assets" }
rsmix-crypto = { path = "packages/crypto" }
rsmix-session = { path = "packages/session" }
rsmix-file-storage = { path = "packages/file-storage" }
rsmix-tar-parser = { path = "packages/tar-parser" }
rsmix-multipart-parser = { path = "packages/multipart-parser" }
rsmix-html-template = { path = "packages/html-template" }
rsmix-headers = { path = "packages/headers" }
rsmix-fetch-proxy = { path = "packages/fetch-proxy" }
rsmix-auth = { path = "packages/auth" }
rsmix-cli = { path = "packages/cli" }
rsmix-cookie = { path = "packages/cookie" }
rsmix-ui = { path = "packages/ui" }
rsmix-data-schema = { path = "packages/data-schema" }
rsmix-lazy-file = { path = "packages/lazy-file" }
rsmix-fs = { path = "packages/fs" }
bytes = "1"
http = "1"
http-body = "1"
memchr = { version = "2.7", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync", "fs", "io-util"] }
bench-app = { path = "bench/rsmix-app/app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to match the wasm-bindgen CLI used by scripts/build-client.ps1. No
# `enable-interning`: the component runtime keeps its own string table (dom/ops.rs), and the
# feature would look up every string passed to JS in a hash map.
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

# PBKDF2 runs 100k HMAC rounds per password check; keep it fast in debug builds and tests.
[profile.dev.package.rsmix-crypto]
opt-level = 3

# Compression runs per request; unoptimized brotli is several times slower (quality 11 on a
# 450 KB wasm file: about 10 s against 1.6 s). Its generic encoder is instantiated in
# rsmix-response (`compress`), so that crate is optimized too.
[profile.dev.package.rsmix-response]
opt-level = 3

[profile.dev.package.rsmix-compression-middleware]
opt-level = 3

[profile.dev.package.rsmix-static-middleware]
opt-level = 3

[profile.dev.package.brotli]
opt-level = 3

[profile.dev.package.alloc-no-stdlib]
opt-level = 3

[profile.dev.package.alloc-stdlib]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

# Size-optimized browser build; the server uses the normal release profile.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
