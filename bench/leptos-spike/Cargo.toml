[package]
name = "rmx-spike"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8.22" }
leptos_router = { version = "0.8" }
leptos_meta = { version = "0.8" }
# #[island] props are serialized into the HTML; the macro expects serde as a direct dependency.
serde = { version = "1", features = ["derive"] }
axum = { version = "0.8", optional = true }
leptos_axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2.106", optional = true }

[features]
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook", "dep:wasm-bindgen"]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]
# Partial hydration: only #[island] components ship to the browser.
# Without it the whole app hydrates (the "full WASM hydration" option).
islands = ["leptos/islands"]

# Size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "rmx-spike"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
env = "DEV"
bin-features = ["ssr", "islands"]
bin-default-features = false
lib-features = ["hydrate", "islands"]
lib-default-features = false
lib-profile-release = "wasm-release"
