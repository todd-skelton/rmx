[package]
name = "rmx-router"
description = "A composable router on Request/Response with route maps, middleware and typed request context (port of remix fetch-router)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
http.workspace = true
rmx-fetch.workspace = true
rmx-macros.workspace = true
rmx-route-pattern.workspace = true
rmx-url.workspace = true

# Doctests and tests use `#[derive(RouteMap)]`, which expands to `::rmx::router` paths.
[dev-dependencies]
rmx = { path = "../rmx", default-features = false }
