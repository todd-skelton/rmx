[package]
name = "rmx"
description = "A Remix 3 style component model for Rust: setup once, render on update(), server HTML, client entries"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rmx-macros.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "CharacterData",
    "Comment",
    "console",
    "Document",
    "DomStringMap",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "Node",
    "Performance",
    "Text",
    "TreeWalker",
    "Window",
] }

[dev-dependencies]
serde.workspace = true
