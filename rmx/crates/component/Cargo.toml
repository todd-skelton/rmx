[package]
name = "rmx-component"
description = "A Remix 3 style component model for Rust: setup once, render on update(), server HTML, client entries"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rmx-macros.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "AbortController",
    "AddEventListenerOptions",
    "AbortSignal",
    "CharacterData",
    "Comment",
    "console",
    "CssRuleList",
    "CssStyleSheet",
    "Document",
    "DocumentFragment",
    "DomParser",
    "DomStringMap",
    "Element",
    "ErrorEvent",
    "Event",
    "EventTarget",
    "FormData",
    "Headers",
    "HtmlElement",
    "HtmlFormElement",
    "HtmlHeadElement",
    "HtmlTemplateElement",
    "Location",
    "MutationObserver",
    "MutationObserverInit",
    "Node",
    "NodeList",
    "Performance",
    "RequestInit",
    "ReadableStream",
    "RequestMode",
    "ScrollBehavior",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "Response",
    "SupportedType",
    "Text",
    "TextDecoder",
    "TreeWalker",
    "Url",
    "UrlSearchParams",
    "Window",
] }

[dev-dependencies]
serde.workspace = true

# Browser tests (`tests/browser_*.rs`): run with ../../test-browser.ps1.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
web-sys = { workspace = true, features = ["ErrorEvent", "ErrorEventInit", "HtmlDivElement", "CssRule", "CssRuleList", "CssStyleSheet", "CssStyleDeclaration", "Window", "HtmlElement", "HtmlHeadElement", "HtmlInputElement", "HtmlTextAreaElement", "EventInit", "HtmlSelectElement", "MouseEvent", "MouseEventInit"] }
