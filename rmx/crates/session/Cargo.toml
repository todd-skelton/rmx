[package]
name = "rmx-session"
description = "Sessions for rmx: a Session with values and flash data, and cookie, memory and filesystem storages (Remix's session package)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rmx-crypto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }

[features]
default = ["fs"]
fs = ["dep:tokio"]

[dev-dependencies]
rmx-fetch.workspace = true
