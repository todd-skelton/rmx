[package]
name = "rmx-serve"
description = "Serve an rmx Router over HTTP/1 and HTTP/2 with hyper and tokio"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
http.workspace = true
http-body.workspace = true
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
rmx-fetch.workspace = true
rmx-router.workspace = true
rmx-url.workspace = true
tokio.workspace = true

[dev-dependencies]
rmx-fetch-proxy.workspace = true
