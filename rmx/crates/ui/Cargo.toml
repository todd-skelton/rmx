[package]
name = "rmx-ui"
description = "UI helpers for rmx (Remix's @remix-run/ui): entrance, exit and layout animation mixins, springs and tweens"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rmx.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "AbortSignal",
    "AddEventListenerOptions",
    "Animation",
    "AnimationEffect",
    "AnimationPlayState",
    "console",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventInit",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "Node",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "Window",
] }
