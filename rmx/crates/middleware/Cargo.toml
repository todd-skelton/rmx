[package]
name = "rmx-middleware"
description = "Middleware for rmx-router: static files, logger, form data, method override, compression, sessions, CSRF, auth, cross-origin protection and CORS"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
http.workspace = true
rmx-fetch.workspace = true
rmx-headers.workspace = true
rmx-mime.workspace = true
rmx-router.workspace = true
rmx-url.workspace = true
rmx-cookie = { workspace = true, optional = true }
rmx-crypto = { workspace = true, optional = true }
rmx-fs = { workspace = true, optional = true }
rmx-html-template = { workspace = true, optional = true }
rmx-lazy-file = { workspace = true, optional = true }
rmx-session = { workspace = true, optional = true }
rmx-terminal = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = ["static", "live-reload", "logger", "form-data", "method-override", "compression", "session", "csrf", "auth", "cop", "cors"]
static = ["dep:rmx-fs", "dep:rmx-lazy-file", "dep:rmx-html-template"]
logger = ["dep:rmx-terminal"]
live-reload = []
form-data = []
method-override = ["form-data"]
compression = ["rmx-fetch/compress"]
session = ["dep:rmx-session", "dep:rmx-cookie", "dep:serde_json"]
csrf = ["session", "form-data", "dep:rmx-crypto"]
auth = ["session"]
cop = []
cors = []

[dev-dependencies]
brotli = { version = "9", default-features = false, features = ["std"] }
flate2 = "1"
tokio.workspace = true
