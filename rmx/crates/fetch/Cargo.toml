[package]
name = "rmx-fetch"
description = "Request, Response and streaming Body types for rmx, on the standard http crate"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
bytes.workspace = true
http.workspace = true
http-body.workspace = true
rmx-crypto.workspace = true
rmx-headers.workspace = true
rmx-html-template.workspace = true
rmx-mime.workspace = true
rmx-multipart-parser.workspace = true
rmx-url.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true

[features]
default = ["json"]
json = ["dep:serde", "dep:serde_json"]

[dev-dependencies]
rmx-lazy-file.workspace = true
tokio = { workspace = true }
