[package]
name = "assets-demo"
description = "The Remix 3 assets demo, in rmx"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rmx.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Element"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
http.workspace = true
rmx-assets.workspace = true
rmx-fetch.workspace = true
rmx-middleware.workspace = true
rmx-render.workspace = true
rmx-router.workspace = true
rmx-serve.workspace = true
tokio.workspace = true
