[workspace]
resolver = "2"
members = [
    "crates/url",
    "crates/route-pattern",
    "crates/fetch",
    "crates/router",
    "crates/serve",
    "crates/mime",
    "crates/middleware",
    "crates/render",
    "crates/cookie",
    "crates/spa",
    "crates/assets",
    "crates/crypto",
    "crates/session",
    "crates/file-storage",
    "crates/tar-parser",
    "crates/headers",
    "crates/component",
    "crates/macros",
    "examples/bench/app",
    "examples/bench/server",
    "examples/bench/client",
    "examples/frames",
    "examples/frame-navigation",
    "examples/lazy-frames",
    "examples/sse",
    "examples/spa",
    "examples/assets",
    "examples/ui",
    "examples/social-auth",
    "examples/i18n",
    "examples/bookstore",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
rmx = { path = "crates/component" }
rmx-macros = { path = "crates/macros" }
rmx-url = { path = "crates/url" }
rmx-route-pattern = { path = "crates/route-pattern" }
rmx-fetch = { path = "crates/fetch" }
rmx-router = { path = "crates/router" }
rmx-serve = { path = "crates/serve" }
rmx-mime = { path = "crates/mime" }
rmx-middleware = { path = "crates/middleware" }
rmx-render = { path = "crates/render" }
rmx-spa = { path = "crates/spa" }
rmx-assets = { path = "crates/assets" }
rmx-crypto = { path = "crates/crypto" }
rmx-session = { path = "crates/session" }
rmx-file-storage = { path = "crates/file-storage" }
rmx-tar-parser = { path = "crates/tar-parser" }
rmx-headers = { path = "crates/headers" }
rmx-cookie = { path = "crates/cookie" }
bytes = "1"
http = "1"
http-body = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync", "fs", "io-util"] }
bench-app = { path = "examples/bench/app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to match the wasm-bindgen CLI used by build-client.ps1.
wasm-bindgen = { version = "=0.2.129", features = ["enable-interning"] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

# PBKDF2 runs 100k HMAC rounds per password check; keep it fast in debug builds and tests.
[profile.dev.package.rmx-crypto]
opt-level = 3

# Size-optimized browser build; the server uses the normal release profile.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
